<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Planos | PD Barber</title>

    <!-- Fontes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Oswald:wght@600&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="../Styles/Planos.css">
</head>

<body>

    <!-- Cabeçalho -->
    <header class="cabecalho">
        <a href="../../index.html" class="logo">PD BARBER</a>

        <!-- Navegação principal -->
        <nav class="navegacao-principal">
            <a href="../../index.html" class="nav-item">
                <span>Início</span>
                <span class="nav-indicador"></span>
            </a>

            <a href="Servicos.html" class="nav-item">
                <span>Serviços</span>
                <span class="nav-indicador"></span>
            </a>

            <a href="Sobre.html" class="nav-item">
                <span>Sobre</span>
                <span class="nav-indicador"></span>
            </a>

            <a href="Planos.html" class="nav-item ativo">
                <span>Planos</span>
                <span class="nav-indicador"></span>
            </a>
        </nav>

        <a href="#" class="botao botao-header">AGENDAR HORÁRIO</a>
    </header>

    <!-- Conteúdo principal -->
    <main class="pagina">
        <div class="conteudo">

            <!-- Título -->
            <div class="titulo-secao">
                <span class="titulo-acento"></span>
                <h1>PLANOS</h1>
            </div>

            <!-- Introdução -->
            <section class="introducao-planos">
                <h2>Cuide do visual o mês inteiro</h2>
                <p>Escolha o plano que combina com sua rotina.</p>
            </section>

            <!-- Planos -->
            <section class="area-planos">

                <!-- Controles dos planos -->
                <input type="radio" name="plano" id="plano-essencial" class="plano-radio">
                <input type="radio" name="plano" id="plano-signature" class="plano-radio">
                <input type="radio" name="plano" id="plano-black" class="plano-radio">

                <div class="lista-planos">

                    <label for="plano-essencial" class="plano-card">
                        <div class="plano-topo">
                            <h3>ESSENCIAL</h3>
                            <span class="preco">R$ 79/mês</span>
                        </div>

                        <div class="beneficios">
                            <p>2 cortes por mês</p>
                            <p>Prioridade no agendamento</p>
                        </div>

                        <span class="botao-assinar">
                            <span class="texto-assinar">ASSINAR</span>
                            <span class="texto-selecionado">SELECIONADO</span>
                        </span>
                    </label>

                    <label for="plano-signature" class="plano-card">
                        <div class="plano-topo">
                            <h3>SIGNATURE</h3>
                            <span class="preco">R$ 129/mês</span>
                        </div>

                        <div class="beneficios">
                            <p>2 cortes + 2 barbas</p>
                            <p>Prioridade no agendamento</p>
                        </div>

                        <span class="botao-assinar">
                            <span class="texto-assinar">ASSINAR</span>
                            <span class="texto-selecionado">SELECIONADO</span>
                        </span>
                    </label>

                    <label for="plano-black" class="plano-card">
                        <div class="plano-topo">
                            <h3>BLACK</h3>
                            <span class="preco">R$ 179/mês</span>
                        </div>

                        <div class="beneficios">
                            <p>4 serviços por mês</p>
                            <p>Prioridade máxima</p>
                        </div>

                        <span class="botao-assinar">
                            <span class="texto-assinar">ASSINAR</span>
                            <span class="texto-selecionado">SELECIONADO</span>
                        </span>
                    </label>

                </div>
            </section>

        </div>
    </main>

</body>

</html>
