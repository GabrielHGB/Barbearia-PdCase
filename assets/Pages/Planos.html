<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Planos | PD Barber</title>

    <!-- Fontes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Oswald:wght@600&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="../Styles/Planos.css">
</head>

<body>

    <!-- Cabeçalho -->
    <header class="cabecalho">
        <a href="../../index.html" class="logo">PD BARBER</a>

        <!-- Navegação desktop -->
        <nav class="navegacao-principal" aria-label="Navegação principal">
            <a href="../../index.html" class="nav-item">
                <span>Início</span>
                <span class="nav-indicador"></span>
            </a>

            <a href="Servicos.html" class="nav-item">
                <span>Serviços</span>
                <span class="nav-indicador"></span>
            </a>

            <a href="Sobre.html" class="nav-item">
                <span>Sobre</span>
                <span class="nav-indicador"></span>
            </a>

            <a href="Planos.html" class="nav-item ativo" aria-current="page">
                <span>Planos</span>
                <span class="nav-indicador"></span>
            </a>
        </nav>

        <a href="Profissionais.html" class="botao botao-header">AGENDAR HORÁRIO</a>

        <!-- Cabeçalho mobile -->
        <a href="../../index.html" class="cabecalho-mobile-voltar" aria-label="Voltar para o início">&lt;</a>
        <span class="cabecalho-mobile-titulo">PLANOS</span>
    </header>

    <!-- Conteúdo -->
    <main class="pagina">
        <div class="conteudo">

            <!-- Título -->
            <header class="cabecalho-planos">
                <div class="titulo-secao">
                    <span class="titulo-acento"></span>
                    <h1>PLANOS</h1>
                </div>

                <div class="introducao-planos">
                    <h2>Cuide do visual o mês inteiro</h2>
                    <p>Escolha o plano que combina com sua rotina.</p>
                </div>
            </header>

            <!-- Planos -->
            <fieldset class="area-planos">
                <legend class="sr-only">Escolha um plano mensal</legend>

                <!-- Controles -->
                <input type="radio" name="plano" id="plano-essencial" class="plano-radio">
                <input type="radio" name="plano" id="plano-signature" class="plano-radio">
                <input type="radio" name="plano" id="plano-black" class="plano-radio">

                <!-- Lista -->
                <ul class="lista-planos">

                    <!-- Essencial -->
                    <li>
                        <label for="plano-essencial" class="plano-card">
                            <div class="plano-topo">
                                <h2>ESSENCIAL</h2>
                                <span class="preco">R$ 79/mês</span>
                            </div>

                            <div class="beneficios">
                                <p>2 cortes por mês</p>
                                <p>Prioridade no agendamento</p>
                            </div>

                            <span class="botao-assinar">
                                <span class="texto-assinar">ASSINAR</span>
                                <span class="texto-selecionado">SELECIONADO</span>
                            </span>
                        </label>
                    </li>

                    <!-- Signature -->
                    <li>
                        <label for="plano-signature" class="plano-card plano-signature-card">
                            <span class="plano-destaque" aria-hidden="true"></span>

                            <div class="plano-topo">
                                <h2>SIGNATURE</h2>
                                <span class="preco">R$ 129/mês</span>
                            </div>

                            <div class="beneficios">
                                <p>2 cortes + 2 barbas</p>
                                <p>Prioridade no agendamento</p>
                            </div>

                            <span class="botao-assinar">
                                <span class="texto-assinar">ASSINAR</span>
                                <span class="texto-selecionado">SELECIONADO</span>
                            </span>
                        </label>
                    </li>

                    <!-- Black -->
                    <li>
                        <label for="plano-black" class="plano-card">
                            <div class="plano-topo">
                                <h2>BLACK</h2>
                                <span class="preco">R$ 179/mês</span>
                            </div>

                            <div class="beneficios">
                                <p>4 serviços por mês</p>
                                <p>Prioridade máxima</p>
                            </div>

                            <span class="botao-assinar">
                                <span class="texto-assinar">ASSINAR</span>
                                <span class="texto-selecionado">SELECIONADO</span>
                            </span>
                        </label>
                    </li>
                </ul>
            </fieldset>
        </div>
    </main>
</body>
</html>
